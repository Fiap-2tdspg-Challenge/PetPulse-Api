spring.application.name=PetPulse

server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# =========================
# Flyway
# =========================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4

spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true


# =========================
# JWT / RSA
# =========================

rsa.private-key=${RSA_PRIVATE_KEY:classpath:certs/private_key.pem}
rsa.public-key=${RSA_PUBLIC_KEY:classpath:certs/public_key.pem}


# =========================
# PETPULSE-AI (motor de IA)
# =========================

petpulse.ai.enabled=${AI_SERVICE_ENABLED:true}
petpulse.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
petpulse.ai.api-key=${AI_SERVICE_KEY:}
petpulse.ai.timeout-ms=${AI_SERVICE_TIMEOUT_MS:30000}
petpulse.ai.history-days=14
petpulse.ai.max-readings=3000
petpulse.ai.cooldown-hours=6
petpulse.ai.live-window-minutes=60


# =========================
# ACTUATOR
# =========================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always